<!DOCTYPE html>
<html lang="en">
<head>
    <title>One Stop Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="navbar">
            <div class="icon">
                <h2 class="logo">One Stop Shop</h2>
            </div>

            <div class="menu">
                <ul>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">SERVICE</a></li>
                    <li><a href="#">DESIGN</a></li>
                    <li><a href="#">CONTACT</a></li>
                </ul>
            </div>

            <div class="search">
                <input class="srch" type="search" placeholder="Type To text">
                <a href="#" > <button class="btn">Search</button></a>
            </div>

            <div class="content">
                <h2>For All Your Needs</h2>
                <p class="par">Make one stop to get all that you need in one place</p>
                
                <button class="cn"><a href="#">Shop Now</a></button>

                <div class="form">
                    <h2>Login here</h2>
                    <input type="email" name="email" placeholder="Enter Email Here">
                    <input type="password" name="password" placeholder="Enter Password Here">
                    <button class="btn"><a href="#">Login</a></button>

                    <p class="link">Don't have an account</p><br>
                        <a href="#">Sign up here</a>
                        <p class="liw">Log in with</p>
                </div>
        </div>
    </div>
</body>
</html>
